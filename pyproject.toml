[project]
name = "pdf2fb2"
version = "0.2.0"
description = "PDF -> FB2 converter: PP-DocLayoutV3 segmentation + Qianfan-OCR, each model in its own venv."
readme = "README.md"
authors = [
    { email = "o.balala@gmail.com" }
]
requires-python = ">=3.10,<3.13"
# Orchestrator only: no ML frameworks here. Paddle lives in workers/layout_worker,
# torch/transformers in workers/ocr_worker (each with its own .venv).
dependencies = [
    "pymupdf>=1.26,<2",
    "pillow>=13,<14; python_version >= '3.11'",  # 13.x fixes PYSEC-2026-4326..4328; needs Python 3.11+
    "pillow>=11,<13; python_version < '3.11'",
    "worker-protocol",
    "opencv-python-headless>=4.10,<5",
    "numpy>=2,<3",
]

[dependency-groups]
dev = [
    "ruff>=0.13,<1",
    "bandit[toml]>=1.8,<2",
    "pip-audit>=2.9,<3",
    "semgrep>=1.130,<2",
    "pytest>=8.4,<10",
]

[project.scripts]
pdf2fb2 = "pdf2fb2.interface.command_line:run_command_line"
pdf2fb2-bench = "pdf2fb2.interface.benchmark_command:run_benchmark_command"

[tool.uv]
# Supply-chain safety: ignore package versions published in the last 7 days.
exclude-newer = "7 days"
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]  # resolve only for your platform
# semgrep pins mcp==1.29.0 (CVE-2026-59951); only its unused `semgrep mcp` subcommand imports it.
override-dependencies = ["mcp>=1.30,<2", "opentelemetry-api>=1.45.1,<2"]

[tool.uv.sources]
worker-protocol = { path = "workers/worker_protocol", editable = true }

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["unit_tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["models", "test_res", "pdf2fb2_output", "input", "output"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "N", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
# S101: pytest tests assert by design (false positive for test code).
# S106/S311 in worker tests: tokenizer special-token names ("[PAD]") are not passwords; seeded test randomness.
"workers/*/unit_tests/*" = ["S101", "S106", "S311"]
"unit_tests/*" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["pdf2fb2", "worker_protocol", "layout_worker", "ocr_worker", "readermarks", "textar_worker",
                     "proofread_worker"]

[tool.bandit]
exclude_dirs = [
    ".venv",
    "workers/layout_worker/.venv",
    "workers/ocr_worker/.venv",
    "workers/worker_protocol/.venv",
    "workers/readermarks_worker/.venv",
    "workers/readermarks_worker/unit_tests",
    "models",
]
