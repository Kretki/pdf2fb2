[project]
name = "ocr-worker"
version = "0.1.0"
description = "Qianfan-OCR text recognition worker for pdf2fb2 (own venv: PyTorch CUDA + transformers)."
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.13,<3",         # >=2.13 fixes CVE-2025-3000 (torch.jit.script memory corruption)
    "torchvision>=0.28,<1",   # matches torch 2.13; fast image processors used by the Qianfan-OCR processor
    "transformers>=5.0,<6",   # Qianfan-OCR (model_type "qianfan_ocr") is loaded natively, no remote code
    "accelerate>=1.10,<2",
    "pillow>=11,<13",
    "worker-protocol",
]

[dependency-groups]
dev = ["pip-audit>=2.9,<3"]

[project.scripts]
ocr-worker = "ocr_worker.__main__:run_worker"

[tool.uv]
# Supply-chain safety: ignore package versions published in the last 7 days.
exclude-newer = "7 days"
# The PyTorch index publishes no upload dates; torch/torchvision are bounded by version ranges instead.
exclude-newer-package = { torch = false, torchvision = false }
# setuptools is pulled in by torch; versions below 83 have PYSEC-2026-3447.
constraint-dependencies = ["setuptools>=83"]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
worker-protocol = { path = "../worker_protocol", editable = true }

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
