[project]
name = "readermarks-worker"
version = "0.1.0"
description = "Reader-mark (handwriting, pen/pencil underline, margin mark) detection and removal worker for pdf2fb2."
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.13,<3",                          # cu130 wheels: RTX 50-series (sm_120)
    "torchvision>=0.28,<1",
    "timm>=1.0.20,<2",                         # ConvNeXt-Tiny encoder of the stage 2 segmenter
    "segmentation-models-pytorch>=0.5,<1",     # U-Net decoder
    "transformers>=5.0,<6",                    # loads the local DINOv2 (facebook/dinov2-small) weights
    "safetensors>=0.6,<1",
    "opencv-python-headless>=4.11,<5",
    "numpy>=2.1,<3",
    "pydantic>=2.11,<3",
    "pyyaml>=6.0.2,<7",
    "typer>=0.16,<1",
    "pillow>=11,<13",
    "worker-protocol",
]

[dependency-groups]
dev = ["pip-audit>=2.9,<3", "pytest>=8.4,<10"]

[project.scripts]
readermarks = "readermarks.__main__:run_command_line"

[tool.uv]
# Supply-chain safety: ignore package versions published in the last 7 days.
exclude-newer = "7 days"
# The PyTorch index publishes no upload dates; torch/torchvision are bounded by version ranges instead.
exclude-newer-package = { torch = false, torchvision = false }
# setuptools is pulled in by torch; versions below 83 have PYSEC-2026-3447.
constraint-dependencies = ["setuptools>=83"]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
worker-protocol = { path = "../worker_protocol", editable = true }

[tool.pytest.ini_options]
testpaths = ["unit_tests"]

[tool.uv.build-backend]
module-name = "readermarks"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
